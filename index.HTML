
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAWTA L - Chat Monde</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#111b21;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#00a884;font-size:20px}
.online{font-size:12px;color:#00a884}
.btn-share{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:15px;background:#0b141a}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.msg.other{background:#202c33}
.msg.me{background:#005c4b;margin-left:auto}
.msg b{color:#53bdeb;display:block;font-size:12px}
.time{font-size:10px;opacity:0.6;float:right;margin-top:4px}
.input-area{background:#202c33;padding:10px;display:flex;gap:8px}
.input-area input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff;outline:none}
button{background:#00a884;border:none;color:#fff;width:45px;height:45px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<div class="header">
<div><h1>KAWTA L 🌍</h1><div class="online">● Monde Entier</div></div>
<button class="btn-share" onclick="shareApp()">Partager</button>
</div>
<div id="messages"></div>
<div class="input-area">
<input id="pseudo" placeholder="Nom" style="max-width:90px">
<input id="text" placeholder="Message...">
<button onclick="send()">➤</button>
</div>
<script>
const msgs=document.getElementById('messages');
function addMsg(name,txt,me=false){
const d=document.createElement('div');d.className='msg '+(me?'me':'other');
d.innerHTML=`<b>${name}</b>${txt}<div class="time">${new Date().toLocaleTimeString()}</div>`;
msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function send(){
const p=document.getElementById('pseudo').value||'Riri';
const t=document.getElementById('text').value;
if(!t)return;
addMsg(p,t,true);
localStorage.setItem('kawta_pseudo',p);
document.getElementById('text').value='';
}
document.getElementById('pseudo').value=localStorage.getItem('kawta_pseudo')||'';
addMsg('KAWTA L','Bienvenue Riri ! 💚 Ton appli marche',false);
function shareApp(){
if(navigator.share){navigator.share({title:'KAWTA L',text:'Rejoins KAWTA L',url:location.href})}
else{navigator.clipboard.writeText(location.href);alert('Lien copié !')}
}
</script>
</body>
</html>
