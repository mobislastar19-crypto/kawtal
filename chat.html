<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAWTA L CHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: sans-serif;}
body{background:#111b21;height:100vh;display:flex;justify-content:center;align-items:center;}
.app{width:100%;max-width:400px;height:100vh;max-height:750px;background:#efeae2;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.header{background:#008069;color:white;padding:14px;display:flex;align-items:center;gap:10px;}
.logo{width:40px;height:40px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#008069;font-weight:bold;}
.login{flex:1;background:white;display:flex;flex-direction:column;justify-content:center;padding:30px;text-align:center;}
.login input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;margin:15px 0;font-size:16px;}
.btn{background:#25D366;color:white;border:none;padding:14px;border-radius:30px;font-weight:bold;width:100%;font-size:16px;}
.chat{display:none;flex:1;flex-direction:column;}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#e5ddd5;}
.msg{max-width:75%;padding:8px 12px;border-radius:8px;font-size:14px;animation:pop .2s;}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.msg.me{align-self:flex-end;background:#d9fdd3;border-top-right-radius:0;}
.msg.other{align-self:flex-start;background:white;border-top-left-radius:0;}
.time{font-size:10px;color:#999;text-align:right;margin-top:3px;}
.input-area{background:#f0f0f0;padding:10px;display:flex;gap:8px;}
.input-area input{flex:1;padding:12px 18px;border:none;border-radius:25px;outline:none;}
.send{width:45px;height:45px;background:#25D366;border:none;border-radius:50%;color:white;font-size:20px;}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">K</div><div style="flex:1"><b>KAWTA L CHAT</b><br><small id="st">Créé par Riri</small></div></div>
<div class="login" id="login"><h2 style="color:#008069">Bienvenue! 💚</h2><p style="color:#666;font-size:14px">Ta vraie appli de chat!</p><input id="name" placeholder="Ton nom, ex: Riri"><button class="btn" onclick="enter()">ENTRER 🚀</button><p style="font-size:11px;color:#999;margin-top:15px">kawtal-chat • Version 1 par Riri</p></div>
<div class="chat" id="chat"><div class="messages" id="msgs"></div><div class="input-area"><input id="txt" placeholder="Message KAWTA L..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div></div>
</div>
<script>
let user='';let messages=JSON.parse(localStorage.getItem('kawtal_msgs')||'[]');
if(messages.length==0){messages=[{n:'KAWTA L',t:'Bienvenue dans KAWTA L CHAT créé par Riri! 💚 Partage le lien à tes amies!',time:'Maintenant'}];}
function enter(){let v=document.getElementById('name').value.trim();if(!v){alert('Mets ton nom');return;}user=v;document.getElementById('login').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('st').innerText='Connecté: '+user;render();}
function render(){let c=document.getElementById('msgs');c.innerHTML='';messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.n==user?'me':'other');d.innerHTML=(m.n!=user?'<b style="font-size:11px;color:#008069">'+m.n+'</b><br>':'')+m.t+'<div class=time>'+m.time+' ✓✓</div>';c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function send(){let i=document.getElementById('txt');let v=i.value.trim();if(!v)return;let mm={n:user,t:v,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};messages.push(mm);localStorage.setItem('kawtal_msgs',JSON.stringify(messages));i.value='';render();setTimeout(()=>{if(messages.length<5){messages.push({n:'Ami KAWTA L',t:'Waouh Riri! Ton appli marche! 😍',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('kawtal_msgs',JSON.stringify(messages));render();}},1000);}
</script>
</body>
</html>
