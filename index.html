<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAWTA L - Monde Entier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#00a884;font-size:20px}
.online{font-size:12px;color:#00a884}
.btn-share{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:15px;background:#0b141a}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:14px}
.msg.other{background:#202c33}
.msg.me{background:#005c4b;margin-left:auto}
.msg b{color:#53bdeb;display:block;font-size:12px}
.time{font-size:10px;opacity:0.6;float:right;margin-top:4px;margin-left:10px}
.input-area{background:#202c33;padding:10px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;padding:12px;border-radius:25px;border:none;background:#2a3942;color:#fff;outline:none}
.input-area button{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:20px}
#login{position:fixed;inset:0;background:#111b21;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#login input{padding:14px;border-radius:25px;border:none;width:100%;max-width:300px;margin:15px 0;background:#202c33;color:#fff;text-align:center;font-size:16px}
#login button{background:#00a884;color:#fff;border:none;padding:14px 30px;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;max-width:300px}
</style>
<script src='https://cdn.scaledrone.com/scaledrone.min.js'></script>
</head>
<body>
<div class="header">
<div><h1>KAWTA L</h1><div class="online">● <span id="count">1</span> Monde entier connecté 🌍</div></div>
<button class="btn-share" onclick="partager()">↗ Partager</button>
</div>
<div id="messages"></div>
<div class="input-area">
<input id="text" placeholder="Message..." onkeypress="if(event.key==='Enter')envoyer()">
<button onclick="envoyer()">➤</button>
</div>
<div id="login">
<h2 style="color:#00a884;font-size:32px">KAWTA L</h2>
<p style="opacity:0.7;margin-top:5px">Monde entier en direct 🌍</p>
<input id="pseudo" placeholder="Ton nom...">
<button onclick="rejoindre()">REJOINDRE LE MONDE</button>
<p style="font-size:11px;opacity:0.5;margin-top:15px">Chat 100% temps réel mondial</p>
</div>
<script>
let drone, room, monNom="";
function partager(){
let url="https://mobislastar19-crypto.github.io/kawtal/";
let txt="🌍 KAWTA L - Viens parler avec moi en DIRECT monde entier! 🔥 👉 "+url;
let wa="https://wa.me/?text="+encodeURIComponent(txt);
window.open(wa,"_blank");
}
function rejoindre(){
let n=document.getElementById('pseudo').value.trim();
if(!n){alert('Mets ton nom Riri!');return;}
monNom=n;
document.getElementById('login').style.display='none';
demarrer();
}
function demarrer(){
drone=new ScaleDrone('QRXfa37d5wrWL2yX',{data:{name:monNom}});
drone.on('open',e=>{
room=drone.subscribe('observable-kawtal-monde');
room.on('open',()=>console.log('Connecté monde'));
room.on('members',m=>{document.getElementById('count').innerText=m.length});
room.on('member_join',()=>{room.getMembers(m=>document.getElementById('count').innerText=m.length)});
room.on('member_leave',()=>{room.getMembers(m=>document.getElementById('count').innerText=m.length)});
room.on('data',(data,member)=>{
if(!data||!data.text)return;
afficher(data.text,member.clientData.name,member.id===drone.clientId);
});
});
}
function afficher(texte,nom,moi){
let d=document.getElementById('messages');
let div=document.createElement('div');
div.className='msg '+(moi?'me':'other');
let heure=new Date().toLocaleTimeString().slice(0,5);
div.innerHTML=(moi?'':'<b>'+nom+'</b>')+texte+'<span class="time">'+heure+'</span>';
d.appendChild(div);
d.scrollTop=d.scrollHeight;
}
function envoyer(){
let inp=document.getElementById('text');
let t=inp.value.trim();
if(!t)return;
drone.publish({room:'observable-kawtal-monde',message:{text:t}});
inp.value='';
}
</script>
</body>
</html>
