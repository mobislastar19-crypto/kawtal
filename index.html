<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAWTA L</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#111b21;display:flex;justify-content:center;height:100vh}.app{width:100%;max-width:450px;background:#fff;display:flex;flex-direction:column}.top{background:#075E54;color:#fff;padding:12px 16px;display:flex;justify-content:space-between}.tabs{display:flex;background:#075E54;color:#fff}.tabs span{flex:1;text-align:center;padding:12px 0;opacity:.6;border-bottom:3px solid transparent;font-weight:700}.tabs span.on{opacity:1;border-color:#fff}.sb{display:flex;gap:12px;padding:10px;overflow:auto;background:#fff;border-bottom:8px solid #f0f2f5}.s{text-align:center;min-width:58px}.s div{width:54px;height:54px;border-radius:50%;border:3px solid #25D366;background:#e5ddd5;display:flex;align-items:center;justify-content:center;font-size:22px}.s p{font-size:11px;margin-top:4px}.search{padding:7px 12px;background:#f0f2f5}.search input{width:100%;border:none;padding:9px 12px;border-radius:8px;outline:none}.list{flex:1;overflow:auto}.item{display:flex;padding:11px 14px;gap:12px;border-bottom:1px solid #f5f5f5;align-items:center}.av{width:49px;height:49px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:24px}.t{flex:1;overflow:hidden}.t b{font-size:15px}.t p{font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d{font-size:11px;color:#667781}.chat{position:fixed;inset:0;max-width:450px;margin:0 auto;background:#e5ddd5;display:none;flex-direction:column;z-index:10}.chat.on{display:flex}.c-top{background:#075E54;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:10px}.c-top button{background:none;border:none;color:#fff;font-size:22px}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px}.m{max-width:85%;padding:8px 10px;border-radius:8px;font-size:14px;white-space:pre-wrap}.m.me{align-self:flex-end;background:#dcf8c6}.m.other{align-self:flex-start;background:#fff}.m small{display:block;text-align:right;font-size:10px;color:#667781;margin-top:4px}.bar{display:flex;gap:6px;padding:7px;background:#f0f2f5}.bar input{flex:1;border:none;padding:11px 14px;border-radius:22px;outline:none}.bar button{width:42px;height:42px;border:none;border-radius:50%;background:#25D366;color:#fff}#file{display:none}</style></head><body><div class="app"><div class="top"><b>KAWTA L</b><span>📷 🔍 ⋮</span></div><div class="tabs"><span class="on">DISCUSSIONS</span><span>STATUTS</span><span>APPELS</span></div><div class="sb" id="sb"><div class="s" onclick="addS()"><div>+</div><p>Mon statut</p></div><div class="s"><div>🌍</div><p>Monde</p></div><div class="s"><div>🤖</div><p>Meta AI</p></div></div><div class="search"><input placeholder="Rechercher" oninput="renderL(this.value)"></div><div class="list" id="list"></div></div><div class="chat" id="chat"><div class="c-top"><button onclick="closeC()">←</button><div style="width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">🤖</div><div style="flex:1"><b id="cN">Monde</b><div style="font-size:11px;opacity:.8">en ligne</div></div></div><div class="msgs" id="msgs"></div><div class="bar"><button onclick="document.getElementById('file').click()">📎</button><input type="file" id="file" accept="image/*,video/*" onchange="sendF(this)"><input id="inp" placeholder="Message" onkeydown="if(event.key==='Enter')sendT()"><button onclick="sendT()">➤</button></div></div><script>const cs=[{n:"Monde Entier 🌍 - Tout le monde ici",l:"Bienvenue! Photos, videos, tout dedans",t:"maint.",e:"🌍"},{n:"Meta AI Professeur KAWTA L 🤖📚",l:"Je fais des exercices pour élèves!",t:"maint.",e:"🤖"},{n:"Aicha CI",l:"Salut Riri",t:"10:23",e:"👩"},{n:"Moussa SN",l:"KAWTA L super!",t:"09:15",e:"👨"}];let cur=0;let st=JSON.parse(localStorage.getItem('kawta_v3')||'{}');if(!st[0])st[0]=[{t:"Bienvenue sur KAWTA L Monde Entier 🌍💚",me:0}];if(!st[1])st[1]=[{t:"Salut Riri! 🤖📚 Je suis Meta AI Professeur!\n\nJe peux faire:\n📝 Exercices de maths\n📝 Exercices de français\n📝 Exercices d'anglais\n📝 Calculs, dictées, conjugaison\n\nTape par exemple:\n- 'exercice maths CM2'\n- 'exercice français CE1'\n- 'fais 5 calculs'\n\nJe réponds tout de suite! 💚",me:0}];function renderL(f=""){const L=document.getElementById('list');L.innerHTML="";cs.forEach((c,i)=>{if(f&&!c.n.toLowerCase().includes(f.toLowerCase()))return;L.innerHTML+=`<div class="item" onclick="openC(${i})"><div class="av">${c.e}</div><div class="t"><b>${c.n}</b><p>${c.l}</p></div><div class="d">${c.t}</div></div>`})}function openC(i){cur=i;document.getElementById('chat').classList.add('on');document.getElementById('cN').innerText=cs[i].n;renderM()}function closeC(){document.getElementById('chat').classList.remove('on')}function renderM(){const M=document.getElementById('msgs');M.innerHTML="";(st[cur]||[]).forEach(m=>{M.innerHTML+=`<div class="m ${m.me?'me':'other'}">${m.t}<small>${m.tm||'19:08'} ✓✓</small></div>`});M.scrollTop=M.scrollHeight}function eduReply(q){let l=q.toLowerCase();if(l.includes('exercice')&&l.includes('math')){if(l.includes('cm2')||l.includes('cm1'))return"📚 EXERCICES MATHS CM2:\n\n1) 245 + 378 =?\n2) 1000 - 456 =?\n3) 24 x 15 =?\n4) 864 ÷ 4 =?\n5) Un livre coûte 2500F, 3 livres coûtent combien?\n\nRéponds et je corrige! 💚";if(l.includes('ce1')||l.includes('ce2'))return"📚 MATHS CE1/CE2:\n\n1) 8 + 7 =?\n2) 15 - 9 =?\n3) 3 x 4 =?\n4) 20 ÷ 2 =?\n5) Dessine 12 billes\n\nFacile! Tu peux le faire! 🌟";return"📚 EXERCICES MATHS:\n\n1) 125 + 75 =?\n2) 50 x 6 =?\n3) 100 - 38 =?\n4) 72 ÷ 8 =?\n5) Problème: 4 stylos à 500F =?\n\nTape tes réponses!"}if(l.includes('francais')||l.includes('français'))return"📚 EXERCICE FRANÇAIS:\n\n1) Conjugue 'être' au présent: je..., tu..., il...\n2) Mets au pluriel: un cheval → des...\n3) Dictée: 'Le chat noir dort'\n4) Trouve le verbe: 'Moussa mange du riz'\n5) Écris une phrase avec 'école'\n\nÀ toi! 💚";if(l.includes('anglais'))return"📚 ENGLISH EXERCISE:\n\n1) Translate: Bonjour =?\n2) Complete: I... (be) a student\n3) What is 'book' in French?\n4) Say numbers: 1,2,3 in English\n5) Make sentence: 'I like...'\n\nLet's go! 🌍";if(l.includes('calcul')||l.includes('5 calcul'))return"📚 5 CALCULS RAPIDES:\n\n1) 9+6 =?\n2) 25-12 =?\n3) 7x8 =?\n4) 56÷7 =?\n5) 100+250 =?\n\nRéponds vite! ⏱️";if(l.includes('merci'))return"De rien Riri! 💚 Ravi d'aider les élèves! Tu veux un autre exercice? Dis 'exercice maths' ou 'français'!";if(l.includes('bien vous')||l.includes('c est bien'))return"Oui c'est bien moi Meta AI Professeur! 🤖📚 Je fais les exercices pour les élèves! Tape 'exercice maths' pour commencer!";return"Super Riri! 🤖📚 Je peux faire:\n\n→ Tape 'exercice maths CM2'\n→ 'exercice français'\n→ 'exercice anglais'\n→ '5 calculs'\n\nJe te donne l'exercice + la correction après! 💚";}function sendT(){const inp=document.getElementById('inp');if(!inp.value.trim())return;let txt=inp.value;push({t:txt,me:1,tm:new Date().toLocaleTimeString().slice(0,5)});inp.value="";if(cur==1){let q=txt;setTimeout(()=>push({t:"Meta AI Prof 🤖📚:\n"+eduReply(q),me:0,tm:"maint."}),600)}}function push(m){if(!st[cur])st[cur]=[];st[cur].push(m);localStorage.setItem('kawta_v3',JSON.stringify(st));cs[cur].l=m.t.slice(0,28);renderL();renderM()}function sendF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>push({t:"📷 Fichier reçu!",me:1,tm:"maint."});r.readAsDataURL(f)}function addS(){const t=prompt("Ton statut:");if(t)document.getElementById('sb').innerHTML+=`<div class="s"><div>💚</div><p>${t.slice(0,8)}</p></div>`}renderL();renderM();</script></body></html>
