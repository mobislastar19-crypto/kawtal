<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAWTA L - 100% WhatsApp</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#111b21;display:flex;justify-content:center;height:100vh}.app{width:100%;max-width:450px;background:#fff;display:flex;flex-direction:column}.top{background:#075E54;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;background:#075E54;color:#fff}.tabs span{flex:1;text-align:center;padding:12px 0;opacity:.6;border-bottom:3px solid transparent;font-weight:700;font-size:14px}.tabs span.on{opacity:1;border-color:#fff}.sb{display:flex;gap:12px;padding:10px;overflow:auto;background:#fff;border-bottom:8px solid #f0f2f5}.s{text-align:center;min-width:62px}.s div{width:56px;height:56px;border-radius:50%;border:3px solid #25D366;background:#e5ddd5;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}.s p{font-size:11px;margin-top:4px;max-width:62px;overflow:hidden;text-overflow:ellipsis}.s.add div{border:3px dashed #25D366;background:#fff}.search{padding:7px 12px;background:#f0f2f5;display:flex;gap:8px}.search input{flex:1;border:none;padding:9px 12px;border-radius:8px;outline:none}.search button{border:none;background:#25D366;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700}.list{flex:1;overflow:auto}.item{display:flex;padding:11px 14px;gap:12px;border-bottom:1px solid #f5f5f5;align-items:center}.av{width:49px;height:49px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.t{flex:1;overflow:hidden}.t b{font-size:15px}.t p{font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d{font-size:11px;color:#667781;text-align:right}.d span{display:block;background:#25D366;color:#fff;border-radius:10px;padding:2px 6px;margin-top:3px}.chat{position:fixed;inset:0;max-width:450px;margin:0 auto;background:#e5ddd5;display:none;flex-direction:column;z-index:10}.chat.on{display:flex}.c-top{background:#075E54;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:10px}.c-top button{background:none;border:none;color:#fff;font-size:22px}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px}.m{max-width:85%;padding:8px 10px;border-radius:8px;font-size:14px;white-space:pre-wrap;position:relative}.m.me{align-self:flex-end;background:#dcf8c6}.m.other{align-self:flex-start;background:#fff}.m img,.m video{max-width:100%;border-radius:6px;margin-top:5px;display:block}.m small{display:block;text-align:right;font-size:10px;color:#667781;margin-top:4px}.bar{display:flex;gap:6px;padding:7px;background:#f0f2f5;align-items:center}.bar input{flex:1;border:none;padding:11px 14px;border-radius:22px;outline:none}.bar button{width:42px;height:42px;border:none;border-radius:50%;background:#25D366;color:#fff;font-size:18px}.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#25D366;color:#fff;border:none;border-radius:50%;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:5}#file,#sfile{display:none}.status-view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}.status-view.on{display:flex}.status-view img,.status-view video{flex:1;object-fit:contain}</style></head><body><div class="app"><div class="top"><b>KAWTA L 💚</b><span>📷 🔍 ⋮</span></div><div class="tabs"><span class="on" onclick="showTab(0)">DISC.</span><span onclick="showTab(1)">STATUTS</span><span onclick="showTab(2)">GROUPES</span><span onclick="showTab(3)">APPELS</span></div><div class="sb" id="sb"></div><div class="search"><input id="q" placeholder="Rechercher" oninput="render()"><button onclick="createGroup()">+ Groupe</button></div><div class="list" id="list"></div><button class="fab" onclick="document.getElementById('file').click()">💬</button></div><div class="chat" id="chat"><div class="c-top"><button onclick="closeC()">←</button><div class="av" id="cAv">🌍</div><div style="flex:1"><b id="cN">Chat</b><div style="font-size:11px;opacity:.8" id="cSub">en ligne</div></div><span>📞 📹 ⋮</span></div><div class="msgs" id="msgs"></div><div class="bar"><button onclick="document.getElementById('file').click()">📎</button><input type="file" id="file" accept="image/*,video/*" onchange="sendF(this)"><input id="inp" placeholder="Message" onkeydown="if(event.key==='Enter')sendT()"><button onclick="sendT()">➤</button></div></div><div class="status-view" id="sv"><div style="padding:12px;color:#fff;display:flex;justify-content:space-between"><span id="svName">Statut</span><button onclick="document.getElementById('sv').classList.remove('on')" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div id="svContent" style="flex:1;display:flex;align-items:center;justify-content:center"></div></div><input type="file" id="sfile" accept="image/*,video/*" onchange="addStatusFile(this)"><script>let contacts=[{n:"Monde Entier 🌍",l:"Tout le monde parle ici! Photo, video, tout",t:"maint.",e:"🌍",type:"group",members:"128 membres"},{n:"Meta AI Prof 🤖📚",l:"Exercices pour élèves - tape 'exercice maths'",t:"maint.",e:"🤖",type:"ai"},{n:"Famille KAWTA L 👨‍👩‍👧‍👦",l:"Groupe famille - photos et videos",t:"10:30",e:"👨‍👩‍👧‍👦",type:"group",members:"5 membres"},{n:"Aicha CI 👩",l:"Salut Riri!",t:"10:23",e:"👩",type:"chat"},{n:"Moussa SN 👨",l:"KAWTA L super!",t:"09:15",e:"👨",type:"chat"}];let statuses=[{n:"Mon statut",e:"+",mine:true},{n:"Monde",e:"🌍",img:""},{n:"Meta AI",e:"🤖"},{n:"Aicha",e:"👩"}];let cur=0;let tab=0;let msgs=JSON.parse(localStorage.getItem('kawta_v4')||'{}');if(!msgs[0])msgs[0]=[{t:"Bienvenue dans Monde Entier 🌍 Tout le monde peut envoyer PHOTO 📷 et VIDEO 🎥 ici!",me:0}];if(!msgs[1])msgs[1]=[{t:"Salut Riri! 🤖📚 Je suis Meta AI Professeur!\n\nJe fais des exercices:\n- exercice maths CM2\n- exercice français\n- 5 calculs\n- exercice anglais\n\nTape et je réponds! 💚",me:0}];function showTab(i){tab=i;document.querySelectorAll('.tabs span').forEach((s,idx)=>s.classList.toggle('on',idx==i));render()}function render(){const sb=document.getElementById('sb');sb.innerHTML=`<div class="s add" onclick="document.getElementById('sfile').click()"><div>📸</div><p>Mon statut</p></div>`;statuses.forEach((s,idx)=>{if(s.mine)return;sb.innerHTML+=`<div class="s" onclick="viewStatus(${idx})"><div>${s.e}</div><p>${s.n}</p></div>`});const L=document.getElementById('list');L.innerHTML="";let q=document.getElementById('q').value.toLowerCase();let list=contacts.filter(c=>{if(tab==0)return true;if(tab==1)return false;if(tab==2)return c.type=='group';if(tab==3)return false;});list.forEach((c,origIdx)=>{let i=contacts.indexOf(c);if(q&&!c.n.toLowerCase().includes(q))return;L.innerHTML+=`<div class="item" onclick="openC(${i})"><div class="av">${c.e}</div><div class="t"><b>${c.n}</b><p>${c.l}</p></div><div class="d">${c.t}<span style="display:${c.unread?'block':'none'}">${c.unread||''}</span></div></div>`});if(tab==1){L.innerHTML=`<div style="padding:20px;text-align:center;color:#667781"><b>Statuts récents</b><p style="margin-top:10px">Clique sur 📸 en haut pour ajouter photo/video statut comme WhatsApp!</p><button onclick="document.getElementById('sfile').click()" style="margin-top:15px;background:#25D366;color:#fff;border:none;padding:10px 20px;border-radius:20px">+ Ajouter Statut Photo/Vidéo</button></div>`+L.innerHTML}}function openC(i){cur=i;document.getElementById('chat').classList.add('on');document.getElementById('cN').innerText=contacts[i].n;document.getElementById('cAv').innerText=contacts[i].e;document.getElementById('cSub').innerText=contacts[i].members||"en ligne";renderM()}function closeC(){document.getElementById('chat').classList.remove('on')}function renderM(){const M=document.getElementById('msgs');M.innerHTML="";(msgs[cur]||[]).forEach(m=>{let h=`<div class="m ${m.me?'me':'other'}">`;if(m.t)h+=m.t;if(m.img)h+=`<img src="${m.img}" onclick="window.open(this.src)">`;if(m.vid)h+=`<video src="${m.vid}" controls></video>`;h+=`<small>${m.tm||'19:08'} ✓✓</small></div>`;M.innerHTML+=h});M.scrollTop=M.scrollHeight}function eduReply(q){let l=q.toLowerCase();if(l.includes('exercice')&&l.includes('math')){if(l.includes('cm2'))return"📚 MATHS CM2:\n1) 245+378=?\n2) 1000-456=?\n3) 24x15=?\n4) 864÷4=?\n5) 3 livres à 2500F=?";return"📚 MATHS:\n1) 125+75=?\n2) 50x6=?\n3) 100-38=?\n4) 72÷8=?\n5) 4 stylos à 500F=?"}if(l.includes('fran'))return"📚 FRANÇAIS:\n1) Conjugue 'être'\n2) Pluriel: un cheval→?\n3) Verbe dans 'Moussa mange'\n4) Phrase avec 'école'";if(l.includes('anglais'))return"📚 ENGLISH:\n1) Bonjour=?\n2) I... a student\n3) Book en français?\n4) 1,2,3 en anglais";if(l.includes('calcul'))return"📚 5 CALCULS:\n1) 9+6=?\n2) 25-12=?\n3) 7x8=?\n4) 56÷7=?\n5) 100+250=?";return"🤖 Tape: 'exercice maths', 'français', 'anglais', '5 calculs' - je réponds!"}function sendT(){const inp=document.getElementById('inp');if(!inp.value.trim())return;let txt=inp.value;push({t:txt,me:1,tm:new Date().toLocaleTimeString().slice(0,5)});inp.value="";if(contacts[cur].type=='ai'){let q=txt;setTimeout(()=>push({t:"Meta AI Prof 🤖📚:\n"+eduReply(q),me:0,tm:"maint."}),600)}else if(contacts[cur].type=='group'){setTimeout(()=>push({t:"👤 Membre: Bien reçu!",me:0,tm:"maint."}),700)}}function push(m){if(!msgs[cur])msgs[cur]=[];msgs[cur].push(m);localStorage.setItem('kawta_v4',JSON.stringify(msgs));contacts[cur].l=(m.t||"📷 Photo").slice(0,28);render();renderM()}function sendF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{if(f.type.startsWith('image'))push({t:"📷 Photo",img:e.target.result,me:1,tm:"maint."});else push({t:"🎥 Vidéo",vid:e.target.result,me:1,tm:"maint."})};r.readAsDataURL(f)}function createGroup(){let n=prompt("Nom du groupe:");if(!n)return;contacts.push({n:n+" 👥",l:"Groupe créé! Ajoutez photos, videos",t:"maint.",e:"👥",type:"group",members:"1 membre"});render()}function addStatusFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{let type=f.type.startsWith('image')?'img':'vid';statuses.push({n:"Mon statut",e:"💚",img:e.target.result,type:type});render();alert("Statut ajouté! ✅ Va dans STATUTS pour voir comme WhatsApp!")};r.readAsDataURL(f)}function viewStatus(i){let s=statuses[i];if(!s.img){alert(s.n+" - Pas de photo/vidéo encore");return;}document.getElementById('sv').classList.add('on');document.getElementById('svName').innerText=s.n;let c=document.getElementById('svContent');if(s.type=='img'||s.img.startsWith('data:image'))c.innerHTML=`<img src="${s.img}" style="max-width:100%;max-height:80vh">`;else c.innerHTML=`<video src="${s.img}" controls autoplay style="max-width:100%;max-height:80vh">`;setTimeout(()=>document.getElementById('sv').classList.remove('on'),5000)}render();</script></body></html>
