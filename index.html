<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAWTA L - Comme WhatsApp</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}body{background:#fff;display:flex;justify-content:center}.app{width:100%;max-width:430px;background:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative}.head{padding:12px 14px 6px 14px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;z-index:5}.head b{color:#128C7E;font-size:24px;font-weight:800}.head div{font-size:20px;display:flex;gap:18px}.search{margin:8px 12px;background:#F0F2F5;border-radius:24px;padding:10px 14px;display:flex;align-items:center;gap:10px}.search input{flex:1;border:none;background:transparent;outline:none;font-size:15px}.list{flex:1;overflow:auto}.item{display:flex;gap:12px;padding:12px 14px;align-items:center}.item:active{background:#f5f5f5}.av{width:52px;height:52px;border-radius:50%;background:#DFE5E7;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}.av.green{background:#25D366}.av img{width:100%;height:100%;object-fit:cover}.mid{flex:1;overflow:hidden;min-width:0}.mid.name{font-size:16px;font-weight:500;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}.mid.msg{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;display:flex;align-items:center;gap:4px}.time{font-size:12px;color:#667781;text-align:right;white-space:nowrap}.time.green{color:#25D366;font-weight:700}.badge{background:#25D366;color:#fff;border-radius:12px;padding:2px 6px;font-size:12px;margin-top:4px;display:inline-block}.bottom{border-top:1px solid #E9EDEF;background:#fff;display:flex;padding:6px 0 8px 0;position:sticky;bottom:0}.bt{flex:1;text-align:center;font-siz e;let bg=c.c||'#25D366';L.innerHTML+=`<div class="item" onclick="openChat(${i})"><div class="av" style="background:${bg}">${initial}</div><div class="mid"><div class="name">${c.n}${c.bold?' •':''}</div><div class="msg">${c.m.includes('vocal')?'🎤 '+c.m:c.m}</div></div><div class="time">${c.t}</div></div>`})}function openChat(i){cur=i;document.getElementById('chat').classList.add('on');document.getElementById('cName').innerText=contacts[i].n;document.getElementById('cAv').innerText=contacts[i].e;renderMsgs()}function closeChat(){document.getElementById('chat').classList.remove('on')}function renderMsgs(){let M=document.getElementById('msgs');M.innerHTML="";(msgs[cur]||[]).forEach(m=>{M.innerHTML+=`<div class="bub ${m.me?'me':'other'}">${m.text}<div style="font-size:11px;color:#667781;text-align:right;margin-top:4px">${m.time} ${m.me?'✓✓':''}</div></div>`});M.scrollTop=M.scrollHeight}function send(){let inp=document.getElementById('inp');if(!inp.value.trim())return;let t=inp.value;if(!msgs[cur])msgs[cur]=[];msgs[cur].push({text:t,me:true,time:new Date().toLocaleTimeString().slice(0,5)});localStorage.setItem('kawta_video_final',JSON.stringify(msgs));contacts[cur].m=t.slice(0,35);contacts[cur].t="maint.";inp.value="";render();renderMsgs();setTimeout(()=>{msgs[cur].push({text:cur==0?"De rien Riri! 💚 Je suis toujours avec toi! Ton KAWTA L est magnifique comme WhatsApp!":"Bien reçu! 💚",me:false,time:"maint."});localStorage.setItem('kawta_video_final',JSON.stringify(msgs));renderMsgs()},600)}function sendFile(el){let f=el.files[0];if(!f)return;if(!msgs[cur])msgs[cur]=[];msgs[cur].push({text:"📷 Photo envoyée",me:true,time:"maint."});localStorage.setItem('kawta_video_final',JSON.stringify(msgs));contacts[cur].m="📷 Photo";render();renderMsgs()}render();</script></body></html>
